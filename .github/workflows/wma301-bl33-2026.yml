name: WMA301 V2 U-Boot 2026.10 BL33 preview

on:
  push:
    branches: ["feat/wma301-uboot-2026.10"]
    paths:
      - "port/uboot-2026.10/**"
      - ".github/workflows/wma301-bl33-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wma301-2026-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout WMA301 overlay
        uses: actions/checkout@v4
      - name: Checkout pinned 2026.10 U-Boot
        uses: actions/checkout@v4
        with:
          repository: Yuzhii0718/uboot-airoha-mediatek
          ref: 628fe8da3a8084f1f43839abb1a5d0470521a2c7
          path: upstream
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            build-essential flex bison libssl-dev device-tree-compiler \
            python3 python3-pyelftools python3-setuptools \
            bc swig file nodejs npm xz-utils
      - name: Test WMABL33 v1 package format offline
        run: python3 -m unittest discover -v -s port/uboot-2026.10 -p 'test_*.py'
      - name: Apply WMA301 board compatibility and Web safeguards
        run: |
          python3 port/uboot-2026.10/apply.py upstream
          git -C upstream diff --check
      - name: Validate V4 UI JavaScript
        run: |
          node --check upstream/failsafe/embedded/fsdata-wma301/main.js
          grep -q 'CONFIG_WEBUI_FAILSAFE_UI_WMA301=y' port/uboot-2026.10/mt7981_tplink_wma301v2_experimental_defconfig
      - name: Prepare Web UI
        run: npm ci --prefix upstream/failsafe/embedded --no-audit --no-fund
      - name: Build experimental BL33
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          make -C upstream mt7981_tplink_wma301v2_experimental_defconfig
          make -C upstream olddefconfig
          python3 port/uboot-2026.10/apply.py upstream --verify
          make -C upstream -j"$(nproc)" all
      - name: Audit embedded V4 UI and Toolbox favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip
          base = Path("upstream/failsafe/embedded/fsdata-wma301/.min")
          required = {
              "index.html.gz": "WMA301 恢复模式",
              "main.js.gz": "原厂 FIP 起点为 0x20000",
              "style.css.gz": "--bg:",
              "favicon.svg.gz": "#102536",
              "initramfs.html.gz": "initramfs",
              "fip.html.gz": "#uboot",
              "bl2.html.gz": "#uboot"
          }
          for asset, marker in required.items():
              p = base / asset
              if not p.is_file():
                  raise SystemExit("V4 asset missing: " + str(p))
              data = gzip.decompress(p.read_bytes()).decode()
              if marker not in data:
                  raise SystemExit("V4 UI marker missing: " + str(p))
          config = Path("upstream/.config").read_text()
          if "CONFIG_WEBUI_FAILSAFE_UI_WMA301=y" not in config:
              raise SystemExit("V4 UI not selected by Kconfig")
          print("V4 SPA, dark/light CSS, original Toolbox favicon and safe routes embedded")
          PY
      - name: Package WMABL33 v1 and cross-check Toolbox format
        run: |
          set -euo pipefail
          mkdir -p output
          python3 port/uboot-2026.10/package_bl33.py \
            upstream/u-boot.bin output/WMA301_BL33_UPDATE.bin \
            --audit output/build-audit.json --experimental
          python3 port/uboot-2026.10/package_bl33.py \
            --verify output/WMA301_BL33_UPDATE.bin \
            --audit output/verify-audit.json
          aarch64-linux-gnu-nm upstream/u-boot | grep -E "wma301_oem_bl33_(validate|write)"
          aarch64-linux-gnu-nm upstream/u-boot | grep -F "wma301_board_runtime_init"
          grep -Fq '# CONFIG_NET_RANDOM_ETHADDR is not set' upstream/.config
          cp upstream/.config output/u-boot.config
          aarch64-linux-gnu-readelf -h upstream/u-boot > output/elf-header.txt
          printf '%s\\n' \
            'EXPERIMENTAL, NOT FOR FLASH: BL33 compatibility has not been verified.' \
            'WMABL33 v1 package framing alone DOES NOT establish an OEM BL31-compatible FIP.' \
            'Toolbox format compliance is not hardware boot or safe-flash certification.' \
            > output/READ-ME-FIRST.txt
      - name: Upload inspection artifact only
        uses: actions/upload-artifact@v4
        with:
          name: WMA301_2026_10_WMABL33_V1_EXPERIMENTAL_NOT_FOR_FLASH
          path: output/
          retention-days: 14
          if-no-files-found: error

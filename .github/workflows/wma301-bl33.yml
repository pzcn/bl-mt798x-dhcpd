name: WMA301 V2 BL33 (OEM BL2/BL31 kept)
on:
  push:
    branches: ["wma301", "feat/wma301-v4-clean"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wma301-bl33-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UB: uboot-mtk-20250711
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler and U-Boot dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-aarch64-linux-gnu build-essential flex bison libssl-dev \
            device-tree-compiler bc python3 python3-setuptools \
            python3-pyelftools swig file binutils-aarch64-linux-gnu nodejs npm

      - name: Prepare output
        run: mkdir -p output

      - name: Validate WMA301 Web UI and guard OEM BL2/FIP endpoints
        run: |
          node --check "$UB/failsafe/embedded/fsdata-wma301/main.js"
          node --check "$UB/failsafe/embedded/fsdata-bootstrap/main.js"
          python3 - <<'PY'
          from pathlib import Path
          s = Path("uboot-mtk-20250711/failsafe/modules/misc.c").read_text()
          a = s.index('httpd_register_uri_handler(inst, "/bl2.html"')
          b = s.index('httpd_register_uri_handler(inst, "/uboot.html"')
          assert '#ifndef CONFIG_MTK_UPGRADE_FW_ONLY' in s[max(0, a-200):a]
          assert '#if !defined(CONFIG_MTK_UPGRADE_FW_ONLY) || defined(CONFIG_MTK_UPGRADE_OEM_FIP_BL33)' in s[max(0, b-200):b]
          js = Path("uboot-mtk-20250711/failsafe/embedded/fsdata-wma301/main.js").read_text()
          assert "WMABL33" in js and 'exists("/uboot.html?probe=1")' in js
          assert "factory_info" in js
          assert 'httpd_register_uri_handler(inst, "/favicon.svg", &favicon_handler, NULL)' in s
          assert 'failsafe_output_file(response, "favicon.svg", "image/svg+xml")' in s
          logo = Path("uboot-mtk-20250711/failsafe/embedded/fsdata-wma301/favicon.svg").read_text()
          page = Path("uboot-mtk-20250711/failsafe/embedded/fsdata-wma301/index.html").read_text()
          assert '<svg xmlns="http://www.w3.org/2000/svg"' in logo
          # Historical Toolbox icon: dark router body, teal Wi-Fi, twin LEDs and ports.
          assert 'rx="16" fill="#102536"' in logo
          assert 'M15 24 Q32 7 49 24 M22 29 Q32 19 42 29' in logo
          assert 'stroke="#42D6C5"' in logo
          assert 'M37 41v6m8-6v6' in logo
          assert '<img src="/favicon.svg"' in page
          assert 'href="/favicon.svg"' in page
          print("WMA301 Web routes, favicon MIME and embedded SVG logo OK")
          PY

      - name: Build BL33 only
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          if test -f "$UB/failsafe/embedded/package.json"; then
            npm install --prefix "$UB/failsafe/embedded" --no-audit --no-fund
          fi
          make -C "$UB" mt7981_tplink_wma301v2_custom_defconfig
          CFG="$UB/.config"
          need() { grep -Fqx "$1" "$CFG" || { echo "MISSING: $1" >&2; exit 1; }; }
          need 'CONFIG_TEXT_BASE=0x41e00000'
          need 'CONFIG_ENV_IS_IN_UBI=y'
          need 'CONFIG_ENV_UBI_VOLUME="ubootenv"'
          need 'CONFIG_ENV_UBI_VOLUME_REDUND="ubootenv2"'
          need 'CONFIG_ENV_UBI_VOLUME_CREATE=y'
          need 'CONFIG_MTK_UBI_RESERVED_VOLUMES="ubootenv=124k;ubootenv2=124k"'
          need 'CONFIG_CMD_GL_BTN=y'
          need 'CONFIG_MTK_WEB_FAILSAFE=y'
          need 'CONFIG_MTK_WEB_FAILSAFE_AFTER_BOOT_FAILURE=y'
          need 'CONFIG_MTK_DHCPD=y'
          need 'CONFIG_WEBUI_FAILSAFE_CONSOLE=y'
          need 'CONFIG_WEBUI_FAILSAFE_ENV=y'
          need 'CONFIG_WEBUI_FAILSAFE_UBI=y'
          need 'CONFIG_MTK_UPGRADE_FW_ONLY=y'
          need 'CONFIG_MTK_UPGRADE_OEM_FIP_BL33=y'
          need 'CONFIG_MTK_UPGRADE_OEM_FIP_BL33_BOARD="tplink,wma301-v2"'
          need 'CONFIG_MTK_MAC_FROM_MTD=y'
          need 'CONFIG_MTK_MAC_MTD_PART="factory_info"'
          need 'CONFIG_MTK_MAC_MTD_OFFSET=0x1c'
          need 'CONFIG_WEBUI_FAILSAFE_UI_WMA301=y'
          need 'CONFIG_GLBTN_DEFAULT_KEYS="reset,mesh"'
          if grep -Eq '^CONFIG_(ENV_IS_IN_MTD|ENV_IS_NOWHERE|ENABLE_NAND_NMBM|MTK_DUAL_BOOT|MEDIATEK_MULTI_MTD_LAYOUT|WEBUI_FAILSAFE_FLASH|WEBUI_FAILSAFE_FACTORY|WEBUI_FAILSAFE_SIMG|WEBUI_FAILSAFE_NAND_RAW|MTK_TELNETD)=y$' "$CFG"; then
            echo "Unsafe configuration" >&2; exit 1
          fi
          make -C "$UB" -j2 all
          test -s "$UB/u-boot.bin"
          cp "$UB/u-boot.bin" output/WMA301_CUSTOM_BL33.bin
          cp "$CFG" output/u-boot.config

      - name: Audit link address and size, make xz
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, struct
          from pathlib import Path
          raw = Path("output/WMA301_CUSTOM_BL33.bin").read_bytes()
          assert struct.unpack_from("<Q", raw, 8)[0] == 0x41e00000
          assert len(raw) < 0x200000, hex(len(raw))   # MTK BL2 BL33 limit
          xz = lzma.compress(raw, format=lzma.FORMAT_XZ,
                             check=lzma.CHECK_CRC32, preset=9)
          assert lzma.decompress(xz) == raw
          Path("output/WMA301_CUSTOM_BL33.xz").write_bytes(xz)
          end = 0x23848 + len(xz)
          rep = {"raw_size": len(raw), "xz_size": len(xz),
                 "fip_end_in_flash": hex(end),
                 "fits_before_0x3c0000": end <= 0x3c0000,
                 "bl33_sha256": hashlib.sha256(raw).hexdigest(),
                 "xz_sha256": hashlib.sha256(xz).hexdigest()}
          assert rep["fits_before_0x3c0000"], rep
          Path("output/size-audit.json").write_text(json.dumps(rep, indent=2) + "\n")
          print(json.dumps(rep, indent=2))
          PY
          python3 - <<'PY'
          import hashlib, lzma, struct
          from pathlib import Path
          raw=Path("output/WMA301_CUSTOM_BL33.bin").read_bytes()
          xz=Path("output/WMA301_CUSTOM_BL33.xz").read_bytes()
          header=struct.pack("<8sII32sII32s32sII",
              b"WMABL33\x00",1,128,b"tplink,wma301-v2\x00".ljust(32,b"\x00"),
              len(xz),len(raw),hashlib.sha256(xz).digest(),
              hashlib.sha256(raw).digest(),0x41e00000,0)
          assert len(header)==128
          pkg=header+xz
          assert pkg[:8]==b"WMABL33\x00"
          assert lzma.decompress(pkg[128:])==raw
          Path("output/WMA301_BL33_UPDATE.bin").write_bytes(pkg)
          Path("output/README_DO_NOT_FLASH.txt").write_text(
              "WMA301 V4 experimental images. DO NOT FLASH or write FIP.\n"
              "OEM BL2/BL31 loading and power-failure recovery are untested.\n")
          PY
          (cd output && sha256sum WMA301_BL33_UPDATE.bin > SHA256SUMS.txt)

      - name: Verify WMABL33 package against U-Boot check_pkg binary contract
        run: |
          python3 -m unittest -v tests/test_wma301_bl33_update.py
          python3 scripts/verify_wma301_bl33_update.py \
            --package output/WMA301_BL33_UPDATE.bin \
            --raw output/WMA301_CUSTOM_BL33.bin \
            --xz output/WMA301_CUSTOM_BL33.xz \
            --report output/update-package-audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: WMA301_BL33_UPDATE
          path: output/WMA301_BL33_UPDATE.bin
          retention-days: 30
          if-no-files-found: error
